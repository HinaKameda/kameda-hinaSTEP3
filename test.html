<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEP3test-KamedaHina</title>
    <link rel="stylesheet" href="test.css">
</head>
<body>
    <header>
    <h1>TNG CAFE</h1>
    <P>心安らぐいっぱいをあなたに</P>
    <nav>
        <ul>
        <li><a href="#about">About</a></li>
        <li><a href="#menu">Menu</a></li>
        <li><a href="#contact">Contact</a></li>
        </ul>
        </nav>
    </header>
    <main>

        <section id="about">
            <h2>About Us</h2>
                <p>TNGCafeは自然の香りに包まれたリラックス空間を提供しております。<br>
                自家焙煎コーヒーと手作りスイーツで、穏やかな時間をお過ごしください。
                </p>
                <img src="カフェの写真.png" alt="カフェの写真"width="200">
        </section>


        <section id="menu">
            <h2>Menu</h2>
        
            
            <div>
                <img src="コーヒー.png" alt="コーヒー" width="200"height="200">
                <p>ブレンドコーヒー</p>
            </div>
            
            
            <div>
                <img src="ケーキ.png" alt="ケーキ" width="200"height="200">
                <p>ベイクドチーズケーキ</p>
            </div>
            
            
            <div>
                <img src="ラテ.png" alt="ラテ" width="200"height="200">                
                <p>カフェラテ</p>
            </div>
        </section>

        <section id="contact">
            <h2>Contact</h2>
            
                <form action="#" method="post">
                    <div class="flex-container">
                    <label for="name">お名前：</label>
                        <input type="text" id="name" name="name">

                    <label for="email">メールアドレス：</label>
                        <input type="email" id="email" name="email">

                    <label for="message">お問い合わせ内容：</label>
                        <textarea id="message" name="otoiawase" rows="4" cols="40"></textarea>
                        <button type="submit">送信</button>
                    </div>
                </form>
        </section> 
    </main>
    <footer>
        <p>©20◯◯ TNG CAFE</p>
    </footer>
</body>
</html>
